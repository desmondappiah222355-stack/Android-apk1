<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Super Calculator – Desmond's Tools</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div class="calculator">
  <div class="tabs">
    <button class="tab active" data-mode="scientific">Scientific</button>
    <button class="tab" data-mode="units">Unit Converter</button>
    <button class="tab" data-mode="dates">Days Between Dates</button>
  </div>

  <!-- Scientific Mode -->
  <div id="scientific" class="mode active">
    <div class="display" id="display">0</div>
    <div class="angle-mode">DEG <span id="angleIndicator">DEG</span></div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="scientific" onclick="clearAll()">C</button>
      <button class="scientific" onclick="clearEntry()">CE</button>
      <button class="scientific" onclick="deleteLast()">DEL</button>
      <button class="scientific" onclick="appendToDisplay('(')">(</button>
      <button class="scientific" onclick="appendToDisplay(')')">)</button>
      <button class="scientific" onclick="toggleAngleMode()">DEG/RAD</button>

      <!-- Row 2 -->
      <button class="scientific" onclick="appendFunction('sin')">sin</button>
      <button class="scientific" onclick="appendFunction('cos')">cos</button>
      <button class="scientific" onclick="appendFunction('tan')">tan</button>
      <button class="scientific" onclick="appendFunction('asin')">asin</button>
      <button class="scientific" onclick="appendFunction('acos')">acos</button>
      <button class="scientific" onclick="appendFunction('atan')">atan</button>

      <!-- Row 3 -->
      <button class="scientific" onclick="appendFunction('sinh')">sinh</button>
      <button class="scientific" onclick="appendFunction('cosh')">cosh</button>
      <button class="scientific" onclick="appendFunction('tanh')">tanh</button>
      <button class="scientific" onclick="appendFunction('Math.exp')">e^x</button>
      <button class="scientific" onclick="appendFunction('Math.pow10')">10^x</button>
      <button class="scientific" onclick="appendToDisplay('Math.PI')">π</button>

      <!-- Row 4 -->
      <button class="scientific" onclick="appendFunction('Math.sqrt')">√</button>
      <button class="scientific" onclick="appendFunction('x²')">x²</button>
      <button class="scientific" onclick="appendToDisplay('**')">^</button>
      <button class="scientific" onclick="appendToDisplay('Math.E')">e</button>
      <button class="scientific" onclick="appendFunction('Math.log')">ln</button>
      <button class="scientific" onclick="appendToDisplay('Math.log10')">log₁₀</button>

      <!-- Numbers & operators -->
      <button class="number" onclick="appendToDisplay('7')">7</button>
      <button class="number" onclick="appendToDisplay('8')">8</button>
      <button class="number" onclick="appendToDisplay('9')">9</button>
      <button class="operator" onclick="appendToDisplay('/')">÷</button>
      <button class="scientific" onclick="memoryAdd()">M+</button>
      <button class="scientific" onclick="memoryRecall()">MR</button>

      <button class="number" onclick="appendToDisplay('4')">4</button>
      <button class="number" onclick="appendToDisplay('5')">5</button>
      <button class="number" onclick="appendToDisplay('6')">6</button>
      <button class="operator" onclick="appendToDisplay('*')">×</button>
      <button class="scientific" onclick="memoryClear()">MC</button>
      <button class="scientific" onclick="memoryStore()">MS</button>

      <button class="number" onclick="appendToDisplay('1')">1</button>
      <button class="number" onclick="appendToDisplay('2')">2</button>
      <button class="number" onclick="appendToDisplay('3')">3</button>
      <button class="operator" onclick="appendToDisplay('-')">-</button>
      <button class="scientific" onclick="appendFunction('Math.factorial')">n!</button>
      <button class="scientific" onclick="appendToDisplay('%')">%</button>

      <button class="number zero" onclick="appendToDisplay('0')">0</button>
      <button class="number" onclick="appendToDisplay('.')">.</button>
      <button class="operator" onclick="appendToDisplay('+')">+</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <!-- Unit Converter Mode -->
  <div id="units" class="mode">
    <div class="display" id="unitDisplay">0</div>
    
    <div class="converter-controls">
      <select id="category">
        <option value="length">Length</option>
        <option value="weight">Weight</option>
        <option value="temperature">Temperature</option>
        <option value="area">Area</option>
        <option value="volume">Volume</option>
        <option value="speed">Speed</option>
        <option value="time">Time</option>
      </select>

      <div class="input-row">
        <input type="number" id="unitInput" placeholder="Enter value" step="any" value="0">
        <select id="fromUnit"></select>
        <span>→</span>
        <select id="toUnit"></select>
      </div>

      <div class="result" id="unitResult">Result: —</div>
    </div>
  </div>

  <!-- Date Difference Mode (unchanged) -->
  <div id="dates" class="mode">
    <div class="display" style="font-size:1.6rem; text-align:center; padding:15px;">
      Days Between Two Dates
    </div>
    <div class="date-controls">
      <label>From:</label>
      <input type="date" id="dateFrom">
      <label>To:</label>
      <input type="date" id="dateTo">
      <button class="equals" onclick="calcDateDiff()">Calculate</button>
      <div class="result" id="dateResult">Difference: — days</div>
    </div>
  </div>
</div>

<script src="js/index.js"></script>
</body>
</html>
