# Build Cordova Android APK with icons & splash screen
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4️⃣ Install Cordova & cordova-res globally
      - name: Install Cordova & cordova-res
        run: npm install -g cordova cordova-res

      # 5️⃣ Install project dependencies
      - name: Install npm dependencies
        run: npm install || echo "No package.json found"

      # 6️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 7️⃣ Install required Android SDK components
      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-32"
          sdkmanager "build-tools;32.0.0"

      # 8️⃣ Install Gradle 7.6
      - name: Install Gradle 7.6
        run: |
          wget https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip gradle-7.6-bin.zip
          sudo mv gradle-7.6 /opt/gradle
          echo "/opt/gradle/bin" >> $GITHUB_PATH

      # 9️⃣ Add Android platform
      - name: Add Android platform
        run: cordova platform add android@11 || echo "Platform already added"

      # 🔟 Generate icons & splash screens
      - name: Generate icons & splash screens
        run: cordova-res android --skip-config --copy

      # 1️⃣1️⃣ Build APK
      - name: Build APK
        run: cordova build android --release --no-daemon

      # 1️⃣2️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-release-apk
          path: platforms/android/app/build/outputs/apk/debug/calc.apk